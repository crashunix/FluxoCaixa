version: '3.8'

services:
  transactions-api:
    build:
      context: ../..
      dockerfile: src/Transactions/FluxoCaixa.Transactions.Api/Dockerfile
    container_name: fluxocaixa-transactions-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
