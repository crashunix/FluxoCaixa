services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: fluxocaixa-postgres
    environment:
      POSTGRES_DB: fluxocaixa_transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxocaixa_transactions"]
      interval: 2s
      timeout: 3s
      retries: 10

  transactions-api:
    build:
      context: ../..
      dockerfile: src/Transactions/FluxoCaixa.Transactions.Api/Dockerfile
    container_name: fluxocaixa-transactions-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fluxocaixa_transactions;Username=postgres;Password=postgres
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres-data:
