services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: fluxocaixa-postgres
    environment:
      POSTGRES_DB: fluxocaixa_transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  transactions-api:
    build:
      context: ../..
      dockerfile: src/Transactions/FluxoCaixa.Transactions.Api/Dockerfile
    container_name: fluxocaixa-transactions-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RabbitMQ__Host=rabbitmq
    depends_on:
      - postgres

volumes:
  postgres-data:
