version: '3.8'

services:
  consolidated-worker:
    build:
      context: ../..
      dockerfile: src/Consolidated/FluxoCaixa.Consolidated.Worker/Dockerfile
    container_name: fluxocaixa-consolidated-worker
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
